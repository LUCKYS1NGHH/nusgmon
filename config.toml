[config]

# Choose the default graph style. available: bar, compact, norm, spark
usage_graph_style = "bar"

# Default display unit: 'kb', 'mb', 'gb'
default_unit = "kb"

# Default usage view, if no argument is given: 'yesterday', 'today', 'thisweek', 'month'
# NOTE: 'month' will always be the CURRENT MONTH if it's set in config.
default_view = "today"

# Save the records at once after certain amount of records in database file
# Higher values = more data loss if the process crashes unexpectedly
save_records_after = 7

# Grace period in seconds before first write (lets the interfaces settle after boot)
startup_grace_period = 10

# Record your desired interfaces usage parallelly (overrides if iface argument is passed)
record_iface = ['wlp2s0', 'enp2s0']
